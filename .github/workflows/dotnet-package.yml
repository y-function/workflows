name: Publish Dotnet Package

on:
  workflow_call:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v6.0.0
      with:
        dotnet-version: 8.0.x
    - name: Define VERSION
      if: github.event_name == 'release'
      run: |
        echo "Version: " $ref_name
        echo "VERSION=$(echo "$ref_name" | cut -c 2-)" >> $GITHUB_ENV
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Test
      run: dotnet test --no-build --verbosity normal
    - name: Pack
      if: github.event_name == 'release'
      run: dotnet pack /p:Version=$VERSION --configuration Release --output ./nupkg
    - name: Publish
      if: github.event_name == 'release'
      run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ secrets.GITHUB_TOKEN }} --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --skip-duplicate
